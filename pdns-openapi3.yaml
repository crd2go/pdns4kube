openapi: 3.0.3
info:
  title: PowerDNS Zone API
  version: 0.0.15
paths:
  /api/v1/servers/localhost/zones:
    post:
      summary: Create Zone
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zone'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /api/v1/servers/localhost/zones/{zone_id}:
    get:
      summary: Read Zone
      operationId: getZone
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
    delete:
      summary: Delete Zone
      operationId: deleteZone
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

    patch:
      summary: Replace RRSet
      operationId: replaceRRSet
      parameters:
        - name: zone_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Record'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'

components:
  schemas:
    Record:
      type: object
      required:
        - zone
        - name
        - type
      properties:
        zone:
          type: string
          example: "example.com."
        name:
          type: string
          example: "www.example.com."
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, NS, PTR, SRV, TXT]
        ttl:
          type: integer
        records:
          type: array
          items:
            type: object
            required:
              - content
            properties:
              content:
                type: string
              disabled:
                type: boolean
          example:
            - content: "192.0.2.1"
    Zone:
      type: object
      required:
        - name
        - kind
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          example: "example.com."
        kind:
          type: string
          enum: [Native, Master, Slave]
          default: "Native"
        nameservers:
          type: array
          items:
            type: string
          example: ["ns1.example.com."]

